version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:Keerth123@db:5432/quiz_db
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: quiz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Keerth123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: